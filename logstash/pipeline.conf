# Flujo de logs: recibe JSON de Flask por HTTP y lo guarda en Elasticsearch.
# Entrada: Flask envía cada evento al puerto 8080.
input {
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json
    ecs_compatibility => "disabled"
  }
}

# Salida: crea índices diarios llamados logstash-AAAA.MM.DD.
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_PASSWORD}"
    manage_template => false
    ilm_enabled => false
    index => "logstash-%{+YYYY.MM.dd}"
  }
}
