# Prometheus consulta sus objetivos cada 10 segundos.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Dos objetivos: el propio Prometheus y la app Flask.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: flask_service
    metrics_path: /metrics
    static_configs:
      - targets: ["flask_service:8000"]
